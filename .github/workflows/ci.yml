name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: macabre

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --verbose
      - name: test
        run: cargo test --verbose
      - name: clippy
        run: cargo clippy -- -D warnings
      - name: fmt check
        run: cargo fmt --check
